name: Deploy recipe library to GitHub Pages

on:
  push:
    branches: [codex/static-deploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install image validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Test static publication boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check app/app.js
      - name: Build from committed public snapshot (no Nikon requests)
        run: python -B app/build_static.py
      - name: Upload only the verified dist directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/static-deploy'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
