name: Deploy recipe library to GitHub Pages

on:
  push:
    branches: [codex/static-deploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install image validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Detect code changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          parent = subprocess.run(['git', 'rev-parse', 'HEAD^'], capture_output=True, text=True)
          full = os.environ['EVENT_NAME'] != 'push' or parent.returncode != 0 or parent.stdout.strip() != os.environ.get('BEFORE_SHA')
          if not full:
              paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
              full = any(p.startswith(('app/', 'tests/', '.github/')) or p == 'requirements.txt' for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('test_code=' + str(full).lower() + '\n')
          PY
      - name: Test static publication boundaries
        if: steps.changes.outputs.test_code == 'true'
        run: python -B -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check app/app.js
      - name: Build from committed public snapshot (no Nikon requests)
        run: python -B app/build_static.py
      - name: Upload only the verified dist directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/static-deploy'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
